<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>集計データ</title>
<style>
	/* 1. 右上のナビゲーションエリア */
	.header-nav {
		display: flex;
		justify-content: flex-end;
		gap: 12px;
		margin-bottom: 20px;
	}

	.nav-btn {
		display: inline-block;
		padding: 6px 20px;
		border: 1.5px solid #333;
		border-radius: 25px;
		background-color: #fff;
		color: #333;
		font-size: 14px;
		font-weight: bold;
		text-decoration: none;
		text-align: center;
		transition: background-color 0.2s;
	}

	.nav-btn:hover {
		background-color: #f0f0f0;
	}

	.nav-btn.active {
		background-color: #000000;
		color: #ffffff;
		border-color: #000000;
	}

	/* 2. メインタイトル */
	.page-title {
		font-size: 48px;
		font-weight: bold;
		color: #555555;
		margin: 0 0 20px 0;
		letter-spacing: 1px;
	}

	/* 3. タブボタンエリア */
	.tab-container {
		display: flex;
		justify-content: space-between;
		align-items: center;
		width: 100%;
		margin-bottom: 20px;
	}

	.tab-left {
		display: flex;
		gap: 15px;
	}

	.tab-right {
		margin-left: auto;
	}

	.btn-tab-shisyutsu {
		display: inline-block;
		width: 120px;
		padding: 6px 0;
		background-color: #ffff00;
		color: #000000;
		border: 1px solid #333;
		text-align: center;
		text-decoration: none;
		font-weight: bold;
		font-size: 14px;
	}

	.btn-tab-syuunyuu {
		display: inline-block;
		width: 120px;
		padding: 6px 0;
		background-color: #a6ff4d;
		color: #000000;
		border: 1px solid #333;
		text-align: center;
		text-decoration: none;
		font-weight: bold;
		font-size: 14px;
	}

	.btn-csv {
		display: inline-block;
		width: 110px;
		padding: 6px 0;
		background-color: #d3d3d3;
		color: #000000;
		border: 1px solid #333;
		text-align: center;
		text-decoration: none;
		font-size: 14px;
		cursor: pointer;
	}

	/* 4. プルダウンと集計ボタン */
	.filter-container {
		margin-bottom: 25px;
	}

	.filter-row {
		display: flex;
		gap: 15px;
		margin-bottom: 8px;
	}

	.filter-select-blue {
		font-size: 14px;
		padding: 4px 10px;
		border: 1px solid #0000cc;
		background-color: #0000ff;
		color: #ffffff;
		font-weight: bold;
		width: 160px;
	}

	.btn-update {
		font-size: 12px;
		padding: 3px 25px;
		border: 1px solid #777;
		background-color: #d3d3d3;
		cursor: pointer;
		border-radius: 2px;
	}

	.btn-update:hover {
		background-color: #c0c0c0;
	}

	/* 5. テーブルスタイル */
	.data-table {
		width: 100%;
		border-collapse: collapse;
		margin-bottom: 30px;
	}

	.data-table th,
	.data-table td {
		border: 1px solid #777777;
		padding: 6px 10px;
		font-size: 14px;
		text-align: left;
	}

	.data-table th {
		background-color: #ffff00;
		font-weight: bold;
		text-align: center;
		color: #000000;
	}

	/* 検索結果0件用メッセージスタイル */
	.no-data-msg {
		color: #ff0000;
		font-size: 16px;
		font-weight: bold;
		margin: 20px 0;
	}
</style>
</head>
<body>

<!-- 右上のナビゲーション -->
<div class="header-nav">
	<a th:href="@{/shisyutsu}" class="nav-btn">支出入力</a>
	<a th:href="@{/syuunyuu}" class="nav-btn">収入入力</a>
	<a th:href="@{/syuukei}" class="nav-btn active">集計データ</a>
	<a th:href="@{/login}" class="nav-btn">ログアウト</a>
</div>

<!-- メインタイトル -->
<h1 class="page-title">集計データ</h1>

<!-- タブボタンエリア -->
<div class="tab-container">
	<div class="tab-left">
		<a th:href="@{/syuukei(type='shisyutsu')}" class="btn-tab-shisyutsu">支出</a>
		<a th:href="@{/syuukei(type='syuunyuu')}" class="btn-tab-syuunyuu">収入</a>
	</div>
	<div class="tab-right">
		<button type="button" class="btn-csv">CSV出力</button>
	</div>
</div>

<!-- 集計条件絞り込みフォーム -->
<form th:action="@{/syuukei}" method="get">
	<input type="hidden" name="type" th:value="${selectedType}" />
	<div class="filter-container">
		<div class="filter-row">
			<!-- 年月選択プルダウン -->
			<select name="yearMonth" class="filter-select-blue">
				<option th:each="ym : ${yearMonthList}" 
					th:value="${ym}" 
					th:text="${ym.replace('-', '年') + '月'}" 
					th:selected="${selectedYearMonth == ym}">
					2026年10月
				</option>
			</select>
			
			<!-- 分類選択プルダウン -->
			<select name="classification" class="filter-select-blue">
				<option value="" th:selected="${selectedClassification == ''}">すべて</option>
				<option th:each="cls : ${classificationList}" 
					th:value="${cls}" 
					th:text="${cls}"
					th:selected="${selectedClassification == cls}">
					食費
				</option>
			</select>
		</div>
		
		<!-- 「集計」ボタン -->
		<button type="submit" class="btn-update">集計</button>
	</div>
</form>

<!-- ★ 検索結果が 0 件の場合は赤字メッセージを表示 -->
<div th:if="${#lists.isEmpty(syuukeiList)}" class="no-data-msg">
	検索結果は０件です
</div>

<!-- ★ 検索結果が存在する場合のみテーブルを表示 -->
<table th:unless="${#lists.isEmpty(syuukeiList)}" class="data-table">
	<thead>
		<tr>
			<th style="width: 15%;">日時</th>
			<th style="width: 15%;">分類</th>
			<th style="width: 10%;">金額</th>
			<th style="width: 15%;">お店</th>
			<th style="width: 15%;">支払方法</th>
			<th style="width: 25%;">メモ</th>
		</tr>
	</thead>
	<tbody>
		<tr th:each="item : ${syuukeiList}">
			<td th:text="${item.date}">01/01</td>
			<td th:text="${item.classification}">食費</td>
			<td th:text="${item.amount != null ? item.amount + ' 円' : ''}">500 円</td>
			<td th:text="${item.shop}">コンビニ</td>
			<td th:text="${item.payment}">財布</td>
			<td th:text="${item.memo}"></td>
		</tr>
	</tbody>
</table>

</body>
</html>
